services:
  - type: web
    name: grochain-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # This app uses an external MongoDB Atlas cluster, not a Render-managed
      # database (Render only provisions Postgres/Redis natively, so
      # `fromDatabase: { name: grochain-mongodb, ... }` can never resolve to
      # a real connection string and left this var effectively unset).
      # Set the real mongodb+srv:// Atlas URI in the Render dashboard:
      # Settings > Environment > MONGODB_URI
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: https://gro-chain.vercel.app
      - key: FRONTEND_URL
        value: https://gro-chain.vercel.app
      # Email Configuration — HTTP APIs only (Render blocks outbound SMTP)
      - key: EMAIL_PROVIDER
        value: resend
      # Resend (primary on Render — works over HTTPS, no SMTP ports needed)
      - key: RESEND_API_KEY
        sync: false  # Set in Render dashboard: Settings > Environment
      - key: RESEND_FROM_EMAIL
        value: GroChain <onboarding@resend.dev>
      - key: RESEND_FROM_NAME
        value: GroChain
      # SendGrid (optional fallback — requires verified sender, NOT gmail.com)
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: onboarding@resend.dev
      - key: SENDGRID_FROM_NAME
        value: GroChain
      # SMTP will NOT work on Render free tier (ports 587/465 blocked) — local dev only
